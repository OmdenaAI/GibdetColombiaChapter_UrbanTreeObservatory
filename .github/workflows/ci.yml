name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Cache pre-commit hooks
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest

    # For GitHub Actions
    services:
      postgres:
        image: postgis/postgis:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urban_tree_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    # For GitHub Actions, we use setup-python
    # For act, we directly install Python
    - name: Set up Python (GitHub Actions)
      if: ${{ !env.ACT }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    # This step only runs when using act
    - name: Set up Python (act)
      if: ${{ env.ACT }}
      run: |
        apt-get update
        apt-get install -y python3 python3-pip python3-venv

    # Install dependencies for both environments
    - name: Install system dependencies
      run: |
        if [ "$ACT" = "true" ]; then
          # For act
          apt-get update
          apt-get install -y binutils libproj-dev gdal-bin libgdal-dev python3-gdal postgresql-client
        else
          # For GitHub Actions
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev python3-gdal postgresql-client
        fi

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Verify PostGIS setup
      run: |
        if [ "$ACT" = "true" ]; then
          # For act - try localhost first, then default Docker IP if that fails
          PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "CREATE EXTENSION IF NOT EXISTS postgis;" || \
          PGPASSWORD=postgres psql -h host.docker.internal -U postgres -d urban_tree_db -c "CREATE EXTENSION IF NOT EXISTS postgis;" || \
          echo "Could not connect to PostgreSQL database. Continuing anyway..."

          PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "SELECT PostGIS_version();" || \
          PGPASSWORD=postgres psql -h host.docker.internal -U postgres -d urban_tree_db -c "SELECT PostGIS_version();" || \
          echo "Could not verify PostGIS version. Continuing anyway..."
        else
          # For GitHub Actions - using localhost
          PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "SELECT PostGIS_version();"
        fi

    - name: Run Django check
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        SECRET_KEY: github-actions-test-key
      run: |
        if [ "$ACT" = "true" ]; then
          # For act - try localhost first
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        else
          # For GitHub Actions - using localhost
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        fi
        python manage.py check

    - name: Run migrations
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        SECRET_KEY: github-actions-test-key
      run: |
        if [ "$ACT" = "true" ]; then
          # For act - using localhost
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        else
          # For GitHub Actions - using localhost
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        fi
        python manage.py migrate

    - name: Run tests
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        SECRET_KEY: github-actions-test-key
      run: |
        if [ "$ACT" = "true" ]; then
          # For act - using localhost
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        else
          # For GitHub Actions - using localhost
          export DATABASE_URL=postgis://postgres:postgres@localhost:5432/urban_tree_db
        fi
        # First try django test runner
        python manage.py test || exit 1
