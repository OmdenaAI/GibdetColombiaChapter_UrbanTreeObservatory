name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Cache pre-commit hooks
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urban_tree_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin python3-gdal

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Set up GDAL environment variables
      run: |
        echo "GDAL_LIBRARY_PATH=$(find /usr/lib -name "libgdal.so*" | head -n 1)" >> $GITHUB_ENV
        echo "GEOS_LIBRARY_PATH=$(find /usr/lib -name "libgeos_c.so*" | head -n 1)" >> $GITHUB_ENV

    - name: Run migrations
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        DATABASE_URL: postgis://postgres:postgres@localhost:5432/urban_tree_db
        SECRET_KEY: github-actions-test-key
      run: |
        python manage.py migrate

    - name: Run tests
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        DATABASE_URL: postgis://postgres:postgres@localhost:5432/urban_tree_db
        SECRET_KEY: github-actions-test-key
      run: |
        python manage.py test
