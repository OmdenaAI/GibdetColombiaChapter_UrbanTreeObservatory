name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
    - name: Cache pre-commit hooks
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urban_tree_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils libproj-dev gdal-bin libgdal-dev python3-gdal

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Set up GDAL environment variables
      run: |
        export CPLUS_INCLUDE_PATH=/usr/include/gdal
        export C_INCLUDE_PATH=/usr/include/gdal
        export GDAL_LIBRARY_PATH=$(gdal-config --libs | grep -o '\-L[^ ]*' | sed 's/-L//g')/libgdal.so
        export GEOS_LIBRARY_PATH=$(find /usr/lib -name "libgeos_c.so*" | head -n 1)

        echo "CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH" >> $GITHUB_ENV
        echo "C_INCLUDE_PATH=$C_INCLUDE_PATH" >> $GITHUB_ENV
        echo "GDAL_LIBRARY_PATH=$GDAL_LIBRARY_PATH" >> $GITHUB_ENV
        echo "GEOS_LIBRARY_PATH=$GEOS_LIBRARY_PATH" >> $GITHUB_ENV

        # Print environment information for debugging
        gdal-config --version
        python -c "import gdal; print(f'GDAL Python binding version: {gdal.__version__}')"

    - name: Verify PostGIS setup
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "CREATE EXTENSION IF NOT EXISTS postgis;"
        PGPASSWORD=postgres psql -h localhost -U postgres -d urban_tree_db -c "SELECT PostGIS_version();"

    - name: Run Django check
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        DATABASE_URL: postgis://postgres:postgres@localhost:5432/urban_tree_db
        SECRET_KEY: github-actions-test-key
      run: |
        python manage.py check

    - name: Run migrations
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        DATABASE_URL: postgis://postgres:postgres@localhost:5432/urban_tree_db
        SECRET_KEY: github-actions-test-key
      run: |
        python manage.py migrate

    - name: Run tests
      working-directory: ./backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings.dev
        DATABASE_URL: postgis://postgres:postgres@localhost:5432/urban_tree_db
        SECRET_KEY: github-actions-test-key
        # Make sure GDAL and GEOS paths are explicitly set for the tests
        GDAL_LIBRARY_PATH: ${{ env.GDAL_LIBRARY_PATH }}
        GEOS_LIBRARY_PATH: ${{ env.GEOS_LIBRARY_PATH }}
      run: |
        # First try pytest, fall back to Django's test runner if needed
        python -m pytest || python manage.py test
