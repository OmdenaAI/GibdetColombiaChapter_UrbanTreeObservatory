volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
  media_volume:

services:
  # PostgreSQL database with PostGIS extension (multi-architecture support)
  db:
    image: nickblah/postgis:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=urban_tree_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django backend API
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev_secret_key
      - DATABASE_URL=postgis://postgres:postgres@db:5432/urban_tree_db
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media
    depends_on:
      db:
        condition: service_healthy

  # Database reset service - use this to reset the database
  db-reset:
    image: nickblah/postgis:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=urban_tree_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: bash -c "rm -rf /var/lib/postgresql/data/* && exit"
    profiles:
      - reset

  # Frontend (Leptos / Rust + WebAssembly, served by Trunk with live reload)
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/target
      - /app/dist
    ports:
      - "4200:4200"
    depends_on:
      - backend

  # PgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@omdena.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
